version: '3.8'
services:
  prometheus:
    image: prom/prometheus:latest
    ports: ["9090:9090"]
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    command: --config.file=/etc/prometheus/prometheus.yml

  grafana:
    image: grafana/grafana:latest
    ports: ["3000:3000"]
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=mairs2025
    volumes:
      - grafana-data:/var/lib/grafana

  node-exporter:
    image: prom/node-exporter:latest
    ports: ["9100:9100"]

  # Fake service metrics generator
  mock-exporter:
    image: python:3.11-slim
    command: python /app/mock_exporter.py
    volumes: ["./mock_exporter.py:/app/mock_exporter.py"]
    ports: ["9200:9200"]

volumes:
  grafana-data:
